name: cookyaapp
description: A recipe app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  audioplayers: ^6.0.0
  image_picker: ^1.2.2
  http: ^1.1.0
  photo_view: ^0.14.0
  video_player: ^2.8.1
  video_thumbnail: ^0.5.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  http_parser: ^4.0.2
  universal_platform: ^1.0.0
  fl_chart: ^0.66.0
  flutter_tts: ^4.2.5
  translator: ^1.0.4+1
  cached_network_image: ^3.3.0
  extended_image: ^8.0.0
  table_calendar: ^3.1.3
  peer_rtc: ^1.1.0
  flutter_webrtc: ^1.0.0
  web_socket_channel: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/loading.gif
    - assets/splash.png
    - assets/splash_pc.png
    - assets/samples/food_1.jpg
    - assets/samples/food_2.jpg
    - assets/samples/food_3.jpg
    - assets/samples/food_4.jpg
    - assets/samples/food_5.jpg
    - assets/samples/food_6.jpg
    - assets/samples/ingredient_1.jpg
    - assets/samples/ingredient_2.jpg
    - assets/samples/cny.jpg
    - assets/samples/chris.jpg
    - assets/samples/dee.jpg
    - assets/samples/duanwu.jpg
    - assets/samples/raya.jpg
    - assets/samples/hallo.jpg
    - assets/samples/m1.jpg
    - assets/samples/m2.jpg
    - assets/samples/lv1.jpg
    - assets/samples/mx1.jpg
    - assets/samples/mx2.jpg
    - assets/samples/mx3.jpg
    - assets/samples/mx4.jpg
    - assets/sounds/cheer.mp3
    - assets/sounds/applause.mp3
    - assets/sounds/cook.mp3
    - assets/sounds/confetti.mp3
    - assets/stickers/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"